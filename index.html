<style>
  :root{
    --black:#000; --card:#161616; --line:#2a2a2a;
    --yellow:#ffd60a; --white:#f5f5f0; --mute:#a8a8a0;
    --r:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--black);color:var(--white);font-family:'Manrope',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.display{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:1.02;letter-spacing:.01em}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  .wrap{width:min(1180px,92%);margin-inline:auto}

  /* Ribbon */
  .ribbon{background:var(--yellow);color:#000;overflow:hidden;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:.95rem;padding:.45rem 0}
  .ribbon-track{display:inline-block;padding-left:100%;animation:run 28s linear infinite}
  .ribbon-track span{margin-right:3rem}
  @keyframes run{to{transform:translateX(-100%)}}

  /* Header */
  header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0}
  .brand{display:flex;align-items:center;gap:.7rem;font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:1.15rem}
  .brand .logo{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--yellow);flex:none}
  .brand .logo .ph{font-size:.55rem;letter-spacing:0;color:#000;background:var(--yellow)}
  .brand .logo .ph small{display:none}
  nav.menu{display:flex;gap:1.6rem;font-weight:600;font-size:.95rem}
  nav.menu a{color:var(--mute);transition:color .15s}
  nav.menu a:hover{color:var(--yellow)}
  .lang{display:flex;border:2px solid var(--yellow);border-radius:var(--r);overflow:hidden}
  .lang button{background:transparent;color:var(--yellow);border:0;padding:.4rem .75rem;font:700 .85rem 'Oswald',sans-serif;letter-spacing:.05em;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--yellow);color:#000}
  @media(max-width:760px){nav.menu{display:none}}

  /* Hero */
  .hero{position:relative;padding:clamp(2.5rem,7vw,6rem) 0 clamp(3rem,7vw,5rem);overflow:hidden}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center}
  @media(max-width:860px){.hero-grid{grid-template-columns:1fr}}
  .slant{transform:rotate(-6deg);transform-origin:left center}
  .tag{display:inline-block;padding:.15em .35em;margin-bottom:.15em;background:var(--yellow)}
  .tag h1{font-size:clamp(2.2rem,6.2vw,4.6rem);color:#000}
  .big{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;color:var(--yellow);font-size:clamp(2.8rem,9vw,7rem);line-height:.98}
  .hero p.lead{margin-top:2.4rem;max-width:34ch;color:var(--mute);font-size:1.1rem}
  .btns{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.6rem}
  .btn{display:inline-block;padding:.85rem 1.5rem;border-radius:var(--r);font:700 1rem 'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;border:2px solid var(--yellow);transition:transform .15s,background .15s,color .15s}
  .btn.primary{background:var(--yellow);color:#000}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{color:var(--yellow)}
  .btn.ghost:hover{background:var(--yellow);color:#000}
  .hero-img{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;border:2px solid var(--line)}

  /* IMG placeholder */
  .ph{background:repeating-linear-gradient(135deg,#1c1c1c 0 14px,#232323 14px 28px);display:grid;place-items:center;width:100%;height:100%;color:var(--yellow);font:700 1.4rem 'Oswald',sans-serif;letter-spacing:.1em;text-align:center}
  .ph small{display:block;color:var(--mute);font:600 .75rem 'Manrope',sans-serif;letter-spacing:0;margin-top:.2rem}
  .imgbox img{width:100%;height:100%;object-fit:cover}

  /* Sections */
  section{padding:clamp(3rem,7vw,5.5rem) 0}
  .sec-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
  .sec-head h2{font-size:clamp(2rem,5vw,3.4rem)}

  /* Categories */
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
  @media(max-width:860px){.cats{grid-template-columns:repeat(2,1fr)}}
  .cat{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;border:2px solid var(--line);cursor:pointer;background:none;color:inherit;padding:0;text-align:left}
  .cat .imgbox{position:absolute;inset:0}
  .cat span{position:absolute;left:0;bottom:1rem;background:var(--yellow);color:#000;font:700 1.2rem 'Oswald',sans-serif;text-transform:uppercase;padding:.25rem .8rem;transform:rotate(-3deg) translateX(-.3rem)}
  .cat:hover{border-color:var(--yellow)}

  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:.5rem}
  .filters button{background:transparent;color:var(--white);border:2px solid var(--line);border-radius:999px;padding:.45rem 1.1rem;font:600 .9rem 'Manrope',sans-serif;cursor:pointer;transition:all .15s}
  .filters button:hover{border-color:var(--yellow)}
  .filters button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#000}

  /* Products */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:.7rem}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--yellow);transform:translateY(-3px)}
  .card .imgbox{aspect-ratio:1/1}
  .card .body{padding:.9rem 1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
  .card h3{font-size:1.15rem;text-transform:none;letter-spacing:0;font-weight:500}
  .card .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .price{font:700 1.5rem 'Oswald',sans-serif;color:var(--yellow)}
  .card .view{font:700 .8rem 'Oswald',sans-serif;text-transform:uppercase;border:2px solid var(--yellow);color:var(--yellow);padding:.3rem .8rem;border-radius:var(--r);transition:background .15s,color .15s}
  .card .view:hover{background:var(--yellow);color:#000}

  /* Why */
  .why{background:var(--yellow);color:#000}
  .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
  @media(max-width:800px){.why-grid{grid-template-columns:1fr}}
  .why h2{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:2rem}
  .why h3{font-size:1.6rem;margin-bottom:.4rem}
  .why p{font-weight:600;max-width:32ch}

  /* Contacts */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
  @media(max-width:800px){.contact-grid{grid-template-columns:1fr}}
  .contact-list{display:grid;gap:.8rem;font-size:1.1rem}
  .contact-list a,.contact-list div{display:flex;gap:.8rem;align-items:baseline;padding:.9rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  .contact-list a:hover{border-color:var(--yellow)}
  .contact-list b{font:700 .9rem 'Oswald',sans-serif;text-transform:uppercase;color:var(--yellow);min-width:6.5rem}

  footer{border-top:1px solid var(--line);padding:1.5rem 0;color:var(--mute);font-size:.9rem}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
  footer a{color:var(--yellow);font-weight:700}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const CATS = ["clothes","shoes","bags","underwear"];
let lang = "ua", activeCat = "all";

/* ── IMG: rasm bo'lsa ko'rsatadi, bo'lmasa sariq-qora joy ── */
function fillImg(el, file, varName){
  el.innerHTML = "";
  const showPh = () => { el.innerHTML = `<div class="ph"><div>IMG<small>${varName}</small></div></div>`; };
  if(!file){ showPh(); return; }
  const img = new Image();
  img.alt = varName; img.loading = "lazy";
  img.onerror = showPh;
  img.src = /^https?:\/\//.test(file) ? file : IMG_FOLDER + file;
  el.appendChild(img);
}

/* ── Рендер ── */
function renderStatic(){
  const t = T[lang];
  document.documentElement.lang = lang === "ua" ? "uk" : lang;
  document.title = t.brand;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = t[el.dataset.i18n]; if(v) el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  const items = t.ribbon.map(s => `<span>★ ${s}</span>`).join("");
  document.getElementById("ribbon").innerHTML = items + items;

  // contacts
  const digits = VIBER.replace(/\D/g,"");
  const vb = document.getElementById("c-viber");
  vb.href = "viber://chat?number=%2B" + digits;
  vb.querySelector("span").textContent = VIBER;
  const tg = document.getElementById("c-tg");
  tg.href = TELEGRAM; tg.querySelector("span").textContent = TELEGRAM.replace(/^https?:\/\//,"");
  const tt = document.getElementById("c-tt");
  tt.href = TIKTOK; tt.querySelector("span").textContent = TIKTOK.replace(/^https?:\/\/(www\.)?/,"");
  document.getElementById("f-tt").href = TIKTOK;
  document.getElementById("c-addr").textContent = ADDRESS[lang];

  // categories
  const catsEl = document.getElementById("cats");
  catsEl.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat"; b.type = "button";
    b.innerHTML = `<div class="imgbox"></div><span>${t["cat_"+c]}</span>`;
    fillImg(b.querySelector(".imgbox"), CAT_IMAGES[c][0], CAT_IMAGES[c][1]);
    b.onclick = () => { activeCat = c; renderProducts(); document.getElementById("products").scrollIntoView({behavior:"smooth"}); };
    catsEl.appendChild(b);
  });

  // filters
  const f = document.getElementById("filters");
  f.innerHTML = "";
  ["all",...CATS].forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = c === "all" ? t.filter_all : t["cat_"+c];
    b.setAttribute("aria-pressed", c === activeCat);
    b.onclick = () => { activeCat = c; renderProducts(); };
    f.appendChild(b);
  });
}

function renderProducts(){
  const t = T[lang];
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  PRODUCTS.filter(p => activeCat === "all" || p.cat === activeCat).forEach(p => {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `<div class="imgbox"></div>
      <div class="body"><h3>${p[lang]}</h3>
        <div class="row"><span class="price">${p.price} ${CURRENCY}</span>
        <a class="view" href="#contacts">${t.view}</a></div></div>`;
    fillImg(el.querySelector(".imgbox"), p.img, p.var);
    grid.appendChild(el);
  });
  document.querySelectorAll("#filters button").forEach((b,i) => {
    b.setAttribute("aria-pressed", ["all",...CATS][i] === activeCat);
  });
}

function setLang(l){
  lang = l;
  try{ localStorage.setItem("lang", l); }catch(e){}
  renderStatic(); renderProducts();
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.querySelectorAll("[data-single]").forEach(el => {
  const [file, name] = SINGLE_IMAGES[el.dataset.single];
  fillImg(el, file, name);
});
document.getElementById("year").textContent = new Date().getFullYear();

let saved = null;
try{ saved = localStorage.getItem("lang"); }catch(e){}
setLang(T[saved] ? saved : "ua");
</script>
</body>
</html>
