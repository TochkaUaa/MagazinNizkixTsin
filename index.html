<style>
  :root{
    --black:#000; --ink:#0d0d0d; --card:#161616; --line:#2a2a2a;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--black);color:var(--white);font-family:'Manrope',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}

  /* ── Ribbon ── */
  .ribbon{background:var(--yellow);color:#000;overflow:hidden;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:.95rem;padding:.45rem 0}
  .ribbon-track{display:inline-block;padding-left:100%;animation:run 28s linear infinite}
  .ribbon-track span{margin-right:3rem}
  @keyframes run{to{transform:translateX(-100%)}}

  /* ── Header ── */
  header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0}
  .brand{display:flex;align-items:center;gap:.7rem;font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:1.15rem}
  .brand .logo{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--yellow);flex:none}
  .brand .logo img{width:100%;height:100%;object-fit:cover}
  nav.menu{display:flex;gap:1.6rem;font-weight:600;font-size:.95rem}
  nav.menu a{color:var(--mute);transition:color .15s}
  nav.menu a:hover{color:var(--yellow)}
  .lang{display:flex;border:2px solid var(--yellow);border-radius:var(--r);overflow:hidden}
  .lang button{background:transparent;color:var(--yellow);border:0;padding:.4rem .75rem;font:700 .85rem 'Oswald',sans-serif;letter-spacing:.05em;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--yellow);color:#000}
  @media(max-width:760px){nav.menu{display:none}}

  /* ── Hero ── */

  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center}
  @media(max-width:860px){.hero-grid{grid-template-columns:1fr}}
  .slant{transform:rotate(-6deg);transform-origin:left center}
  .tag{display:inline-block;border:5px solid var(--yellow);padding:.15em .35em;margin-bottom:.15em}
  .tag h1{font-size:clamp(2.2rem,6.2vw,4.6rem);color:var(--yellow)}
  .big{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;color:var(--yellow);font-size:clamp(2.8rem,9vw,7rem);line-height:.98}
  .tag.solid{background:var(--yellow)}
  .tag.solid h1{color:#000}
  .hero p.lead{margin-top:2.4rem;max-width:34ch;color:var(--mute);font-size:1.1rem}
  .btns{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.6rem}
  .btn{display:inline-block;padding:.85rem 1.5rem;border-radius:var(--r);font:700 1rem 'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;border:2px solid var(--yellow);transition:transform .15s,background .15s,color .15s}

  /* contacts */

  .contact-list{display:grid;gap:.8rem;font-size:1.1rem}
  .contact-list a,.contact-list div{display:flex;gap:.8rem;align-items:baseline;padding:.9rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  .contact-list a:hover{border-color:var(--yellow)}
  .contact-list b{font:700 .9rem 'Oswald',sans-serif;text-transform:uppercase;color:var(--yellow);min-width:6.5rem}

  footer{border-top:1px solid var(--line);padding:1.5rem 0;color:var(--mute);font-size:.9rem}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

const CATS = ["clothes","shoes","bags","underwear"];
let lang = "ua", activeCat = "all";

/* ── IMG: rasm bo'lsa ko'rsatadi, bo'lmasa sariq-qora joy ── */
function fillImg(el, key, label){
  const src = IMG[key];
  el.innerHTML = "";
  if(!src){ el.innerHTML = `<div class="ph"><div>IMG<small>${label||key}</small></div></div>`; return; }
  const img = new Image();
  img.alt = label || key; img.loading = "lazy";
  img.onerror = () => { el.innerHTML = `<div class="ph"><div>IMG<small>${src}</small></div></div>`; };
  img.src = src;
  el.appendChild(img);
}

/* ── Рендер ── */
function renderStatic(){
  const t = T[lang];
  document.documentElement.lang = lang === "ua" ? "uk" : lang;
  document.title = t.brand;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = t[el.dataset.i18n]; if(v) el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  // ribbon
  const items = t.ribbon.map(s => `<span>★ ${s}</span>`).join("");
  document.getElementById("ribbon").innerHTML = items + items;

  // contacts
  const ph = document.getElementById("c-phone");
  ph.href = "tel:" + CONTACT.phone.replace(/[^\d+]/g,""); ph.querySelector("span").textContent = CONTACT.phone;
  const tg = document.getElementById("c-tg"); tg.href = CONTACT.telegram; tg.querySelector("span").textContent = CONTACT.telegram.replace("https://","");
  const ig = document.getElementById("c-ig"); ig.href = CONTACT.instagram; ig.querySelector("span").textContent = CONTACT.instagram.replace("https://","");
  document.getElementById("c-addr").textContent = CONTACT.address[lang];

  // categories
  const catsEl = document.getElementById("cats");
  catsEl.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat"; b.type = "button";
    b.innerHTML = `<div class="imgbox"></div><span>${t["cat_"+c]}</span>`;
    fillImg(b.querySelector(".imgbox"), "cat_"+c, t["cat_"+c]);
    b.onclick = () => { activeCat = c; renderProducts(); document.getElementById("products").scrollIntoView({behavior:"smooth"}); };
    catsEl.appendChild(b);
  });

  // filters
  const f = document.getElementById("filters");
  f.innerHTML = "";
  ["all",...CATS].forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = c === "all" ? t.filter_all : t["cat_"+c];
    b.setAttribute("aria-pressed", c === activeCat);
    b.onclick = () => { activeCat = c; renderProducts(); };
    f.appendChild(b);
  });
}

function renderProducts(){
  const t = T[lang];
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  PRODUCTS.filter(p => activeCat === "all" || p.cat === activeCat).forEach(p => {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `<div class="imgbox"></div>
      <div class="body"><h3>${p[lang]}</h3>
        <div class="row"><span class="price">${p.price} ${t.currency}</span>
        <a class="buy" href="#contacts">${t.buy}</a></div></div>`;
    fillImg(el.querySelector(".imgbox"), p.id, p[lang]);
    grid.appendChild(el);
  });
  document.querySelectorAll("#filters button").forEach((b,i) => {
    const key = ["all",...CATS][i]; b.setAttribute("aria-pressed", key === activeCat);
  });
}

function setLang(l){
  lang = l;
  try{ localStorage.setItem("lang", l); }catch(e){}
  renderStatic(); renderProducts();
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.querySelectorAll("[data-img]").forEach(el => fillImg(el, el.dataset.img));
document.getElementById("year").textContent = new Date().getFullYear();

/* Default — українська. Agar foydalanuvchi avval til tanlagan bo'lsa, o'shani eslaydi */
let saved = null;
try{ saved = localStorage.getItem("lang"); }catch(e){}
setLang(T[saved] ? saved : "ua");
</script>
</body>
</html>
